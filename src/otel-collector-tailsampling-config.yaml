# OpenTelemetry Collector configuration
#
# Pipeline shape:
#
#   otlp ──► traces ──► spanmetrics  ──┐
#                       servicegraph ──┼──► metrics ──► otlphttp/otlpbackend
#                                otlp ─┘
#                       forward/traces ──► traces/sampled ──► tail_sampling ──► otlphttp/otlpbackend
#
# Span metrics and service graph metrics are produced from the FULL trace
# stream (before sampling), so RED/topology metrics stay accurate even when
# only a fraction of traces is exported. The tail_sampling processor sits
# on the second branch and keeps only errors, slow traces, and a small
# probabilistic baseline.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

connectors:
  # Generates RED metrics (calls, duration, errors) per service from spans.
  spanmetrics:
    namespace: traces.spanmetrics
    histogram:
      explicit:
        buckets: [100ms, 500ms, 750ms, 1s, 2s, 5s]
      unit: s
    dimensions:
      - name: service.namespace
      - name: deployment.environment.name
      - name: k8s.cluster.name
      - name: k8s.namespace.name
      - name: k8s.pod.name
    exemplars:
      enabled: true
      max_per_data_point: 5
    exclude_dimensions: ['status.code']
    metrics_flush_interval: 15s
    metrics_expiration: 5m
    events:
      enabled: false

  # Generates service-to-service edge metrics (request counts, error counts,
  # latency histograms) used to render service maps.
  servicegraph:
    latency_histogram_buckets: [100ms, 250ms, 500ms, 1s, 2s, 5s, 10s]
    dimensions:
      - service.namespace
      - deployment.environment.name
      - k8s.cluster.name
    store:
      ttl: 2s
      max_items: 1000
    metrics_flush_interval: 60s

  # Forks the trace stream: spanmetrics/servicegraph consume the unsampled
  # spans from the `traces` pipeline; this connector forwards the same spans
  # into the `traces/sampled` pipeline where tail_sampling runs.
  forward/traces: {}

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

  batch:
    send_batch_size: 1000
    timeout: 10s

  # Tail sampling buffers complete traces and applies policies on the full
  # trace once all spans have arrived (decision_wait). Must run on a single
  # collector instance per trace, or upstream the load balancing exporter
  # must shard by trace_id.
  tail_sampling:
    decision_wait: 30s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      # Keep every trace that contains a span with ERROR status.
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      # Keep traces whose root span exceeded 1s end-to-end.
      - name: sample-slow-traces
        type: latency
        latency:
          threshold_ms: 1000
      # Baseline probabilistic sample of everything else.
      - name: standard-sampling
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

extensions:
  basicauth/otlpbackend:
    client_auth:
      username: ${env:OTLP_USER}
      password: ${env:OTLP_PASSWORD}
  health_check:
    endpoint: 0.0.0.0:13133

exporters:
  otlphttp/otlpbackend:
    endpoint: ${env:OTLP_URL}
    auth:
      authenticator: basicauth/otlpbackend

service:
  extensions: [basicauth/otlpbackend, health_check]
  pipelines:
    # All incoming traces -> connectors. Metrics are computed here from the
    # complete, unsampled span stream. forward/traces carries the same spans
    # into the sampled pipeline below.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [spanmetrics, servicegraph, forward/traces]

    # Sampled output. tail_sampling decides which traces to keep and only
    # those are sent to the backend.
    traces/sampled:
      receivers: [forward/traces]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlphttp/otlpbackend]

    # Metrics from the spanmetrics/servicegraph connectors plus any OTLP
    # metrics the collector receives directly.
    metrics:
      receivers: [otlp, spanmetrics, servicegraph]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/otlpbackend]

  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
