<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --accent: #3b6ef5; --border: #e3e6ea; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111318; --card: #1b1e25; --text: #e6e8ec; --muted: #9aa1ad; --accent: #6b93ff; --border: #2c313b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    h1 { margin: 0 0 16px; font-size: 28px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; }
    button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--border); }
    li:first-child { border-top: 0; }
    li span { flex: 1; word-break: break-word; }
    li.done span { text-decoration: line-through; color: var(--muted); }
    li button { background: transparent; color: var(--muted); padding: 4px 8px; }
    li button:hover { color: #e5484d; }
    .empty { padding: 16px; color: var(--muted); text-align: center; }
    footer { margin-top: 12px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>Todo</h1>
  <form id="add">
    <input id="title" type="text" placeholder="What needs doing?" autocomplete="off" required>
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
  <footer id="count"></footer>
</main>
<script>
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  const titleInput = document.getElementById('title');

  async function api(path, options = {}) {
    const res = await fetch('/api/todos' + path, {
      headers: { 'Content-Type': 'application/json' },
      ...options
    });
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    return res.status === 204 ? null : res.json();
  }

  function render(todos) {
    list.replaceChildren();
    if (todos.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'Nothing to do.';
      list.append(li);
    }
    for (const todo of todos) {
      const li = document.createElement('li');
      if (todo.done) li.className = 'done';

      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = todo.done;
      box.onchange = () => api('/' + todo.id, { method: 'PUT', body: JSON.stringify({ done: box.checked }) }).then(load);

      const text = document.createElement('span');
      text.textContent = todo.title;

      const del = document.createElement('button');
      del.textContent = '✕';
      del.title = 'Delete';
      del.onclick = () => api('/' + todo.id, { method: 'DELETE' }).then(load);

      li.append(box, text, del);
      list.append(li);
    }
    const left = todos.filter(t => !t.done).length;
    count.textContent = `${left} remaining of ${todos.length}`;
  }

  async function load() {
    render(await api(''));
  }

  document.getElementById('add').onsubmit = async (e) => {
    e.preventDefault();
    const title = titleInput.value.trim();
    if (!title) return;
    await api('', { method: 'POST', body: JSON.stringify({ title }) });
    titleInput.value = '';
    load();
  };

  load().catch(err => { count.textContent = 'Failed to load: ' + err.message; });
</script>
</body>
</html>
